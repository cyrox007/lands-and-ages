# Одноразовый импорт лицензированных CC0-моделей в исходный проект.
# После успешной загрузки этот служебный workflow удаляется из ветки.
name: "Импорт оригинальных моделей фауны в исходники"
on:
  push:
    branches: [fix/vendor-fauna-assets-in-source]
    paths:
      - ".github/workflows/vendor-fauna-assets-once.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: "Установить проверенные модели с закреплёнными хешами"
        run: |
          python3 tools/install_fauna_assets.py
          python3 tools/install_fauna_assets.py --check
      - name: "Включить бинарные модели непосредственно в исходники"
        run: |
          # Для Godot важны исходные GLTF/GLB, их внешние зависимости
          # и подтверждённое происхождение. В git добавляются все.
          git add -f godot/assets/fauna
          test -f godot/assets/fauna/asset_provenance.json
          test "$(find godot/assets/fauna -type f \( -name '*.gltf' -o -name '*.glb' \) | wc -l)" -ge 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: включить оригинальные CC0-модели фауны"
          git push origin HEAD:fix/vendor-fauna-assets-in-source
