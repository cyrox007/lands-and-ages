name: "12.7–12.8 — продукты животных и домашние линии"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/wildlife_harvest.gd"
      - "godot/scripts/wildlife_domestication.gd"
      - "godot/scripts/wildlife_region_access.gd"
      - "godot/scripts/wildlife_populations.gd"
      - "godot/scripts/wildlife_food_web.gd"
      - "godot/scripts/wildlife_habitats.gd"
      - "godot/scripts/world.gd"
      - "godot/scripts/world_save.gd"
      - "godot/tests/world_wildlife_harvest_12_smoke.gd"
      - "godot/tests/world_wildlife_domestication_12_smoke.gd"
      - ".github/workflows/godot-stage12-animal-economy.yml"
  workflow_dispatch:

jobs:
  animal-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: "Установить Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Проверить импорт Godot и строгую компиляцию"
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/import.log; then exit 1; fi
      - name: "12.7 — настоящая охота, продукты и WorldSave"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_wildlife_harvest_12_smoke.gd \
            2>&1 | tee /tmp/harvest.log
          grep -q "STAGE12-HARVEST: успешно" /tmp/harvest.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/harvest.log; then exit 1; fi
      - name: "12.8 — отлов предков и несколько поколений"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_wildlife_domestication_12_smoke.gd \
            2>&1 | tee /tmp/domestic.log
          grep -q "STAGE12-DOMESTIC: успешно" /tmp/domestic.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/domestic.log; then exit 1; fi
