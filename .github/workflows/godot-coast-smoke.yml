name: Быстрая проверка берегов и паводков

on:
  push:
    paths:
      - "godot/scripts/shore_visual.gd"
      - "godot/scripts/water_mesh.gd"
      - "godot/scripts/chunk.gd"
      - "godot/tests/coast_wet_visual_smoke.gd"
      - "godot/tests/flood_dry_slope_9_4_smoke.gd"
      - ".github/workflows/godot-coast-smoke.yml"
  pull_request:
    paths:
      - "godot/scripts/shore_visual.gd"
      - "godot/scripts/water_mesh.gd"
      - "godot/scripts/chunk.gd"
      - "godot/tests/coast_wet_visual_smoke.gd"
      - "godot/tests/flood_dry_slope_9_4_smoke.gd"
      - ".github/workflows/godot-coast-smoke.yml"

jobs:
  coast-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Импорт скриптов и ресурсов
        run: |
          set -o pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/godot-import-coast.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load" /tmp/godot-import-coast.log; then
            exit 1
          fi
      - name: Проверить геометрию берега и паводка
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/coast_wet_visual_smoke.gd \
            2>&1 | tee /tmp/coast-smoke.log
          grep -q "Берег и влажность:.*успешно" /tmp/coast-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/coast-smoke.log; then
            exit 1
          fi
      - name: "9.4/#96 — сухой склон, стык двух чанков и настоящий паводок"
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/flood_dry_slope_9_4_smoke.gd \
            2>&1 | tee /tmp/flood-dry-slope-9-4.log
          grep -q "9.4/#96: сухой склон, общий шов и реальный паводок — успешно" /tmp/flood-dry-slope-9-4.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/flood-dry-slope-9-4.log; then
            exit 1
          fi
      - name: Проверить физическую береговую кромку
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/natural_shoreline_visual_smoke.gd \
            2>&1 | tee /tmp/coast-physical.log
          grep -q "Этап 8.2:.*успешно" /tmp/coast-physical.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/coast-physical.log; then
            exit 1
          fi
