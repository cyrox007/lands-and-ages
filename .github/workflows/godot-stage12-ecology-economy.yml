name: "12.10 — год хозяйственной охоты и домашнего скота"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/tests/world_wildlife_economy_year_12_audit.gd"
      - "godot/scripts/wildlife_harvest.gd"
      - "godot/scripts/wildlife_domestication.gd"
      - "godot/scripts/wildlife_food_web.gd"
      - "godot/scripts/wildlife_populations.gd"
      - ".github/workflows/godot-stage12-ecology-economy.yml"
  workflow_dispatch:

jobs:
  full-year-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        seed: [1729, 9021]
    steps:
      - uses: actions/checkout@v4
      - name: "Godot 4.7.2 — установить"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Проверить импорт моделей мира"
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/import.log; then exit 1; fi
      - name: "365 суток с настоящей охотой, разделкой и потомством — ${{ matrix.seed }}"
        run: |
          set -o pipefail
          timeout 900s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_wildlife_economy_year_12_audit.gd \
            -- --seed=${{ matrix.seed }} 2>&1 | tee /tmp/economy.log
          grep -q "STAGE12-ECONOMY-FAUNA: успешно" /tmp/economy.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/economy.log; then exit 1; fi
      - name: "Сохранить годовую экономическую статистику"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "охота-и-скот-${{ matrix.seed }}"
          path: /tmp/economy.log
          if-no-files-found: ignore
