name: Import v0.4 source
on:
  push:
    branches: [main]
    paths:
      - 'lands-and-ages-github-ready-v0.4.zip'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve uploaded archive
        run: |
          test -f lands-and-ages-github-ready-v0.4.zip
          cp lands-and-ages-github-ready-v0.4.zip /tmp/lands-ages-v0.4.zip
      - name: Import source into develop
        run: |
          git switch develop
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive=Path('/tmp/lands-ages-v0.4.zip')
          root=Path.cwd()
          with ZipFile(archive) as z:
              items=z.infolist()
              if len(items)>150 or sum(i.file_size for i in items)>30_000_000:
                  raise SystemExit('Unexpected archive size')
              names={i.filename for i in items if not i.is_dir()}
              required={'engine.js','ui.js','index.html','style.css','package.json','play.html','tests/engine.test.cjs','.github/workflows/check.yml'}
              if not required.issubset(names):
                  raise SystemExit('Missing required strategy sources: '+str(required-names))
              for item in items:
                  path=PurePosixPath(item.filename)
                  if (path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0]=='.git'
                      or (item.external_attr >> 16) & 0o170000 == 0o120000):
                      raise SystemExit('Unsafe archive entry: '+item.filename)
                  if item.is_dir():
                      continue
                  target=root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Verify engine and construction tests
        run: npm run check
      - name: Commit to develop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import playable 0.4 strategy, assets and tests'
          git push origin HEAD:develop
      - name: Remove migration archive from main
        run: |
          git switch main
          git rm -f lands-and-ages-github-ready-v0.4.zip
          git commit -m 'chore: complete source import into develop'
          git push origin HEAD:main
