name: "12.10 — долгие сезоны и экологическая устойчивость"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/tests/world_wildlife_year_12_smoke.gd"
      - "godot/scripts/wildlife_populations.gd"
      - "godot/scripts/wildlife_food_web.gd"
      - "godot/scripts/world_day_runner.gd"
      - "godot/scripts/world_save.gd"
      - ".github/workflows/godot-stage12-year.yml"
  workflow_dispatch:

jobs:
  wildlife-years:
    name: "Физический год — seed ${{ matrix.seed }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 1729
            years: 2
          - seed: 1802
            years: 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: "Установка Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Импорт проекта и проверка GDScript"
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/import.log; then exit 1; fi
      - name: "Полный природный цикл, баланс, сохранение"
        run: |
          set -o pipefail
          timeout 520s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_wildlife_year_12_smoke.gd \
            -- --seed=${{ matrix.seed }} --years=${{ matrix.years }} \
            2>&1 | tee /tmp/year.log
          grep -q "STAGE12-YEAR: успешно" /tmp/year.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/year.log; then exit 1; fi
      - name: "Сохранить результаты испытания"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "годовые-замеры-${{ matrix.seed }}"
          path: /tmp/year.log
          if-no-files-found: ignore
