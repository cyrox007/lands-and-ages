name: "13.0–13.6 — физическое поселение и 3D-центр"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/world_settlement.gd"
      - "godot/scripts/world_headquarters_rules.gd"
      - "godot/scripts/world_headquarters_visual.gd"
      - "godot/assets/buildings/headquarters/**"
      - "tools/generate_headquarters_art.mjs"
      - "godot/scripts/natural_resource_recipes.gd"
      - "godot/scripts/world_build_picker.gd"
      - "godot/scripts/world_settlement_visual.gd"
      - "godot/scripts/world_save.gd"
      - "godot/scripts/world.gd"
      - "godot/scripts/world_first_economy.gd"
      - "godot/scripts/world_resource_industry.gd"
      - "godot/scripts/world_resource_path.gd"
      - "godot/scripts/world_road_topology.gd"
      - "godot/tests/world_settlement_13_smoke.gd"
      - "art/reference/headquarters/**"
      - "godot/tests/world_build_picker_13_smoke.gd"
      - "godot/tests/world_stage13_multiseed_smoke.gd"
      - ".github/workflows/godot-stage13-settlement.yml"
  workflow_dispatch:

jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: "Установить Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Проверка геометрии художественных glTF-ассетов"
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          path = Path("godot/assets/buildings/headquarters/headquarters_art.gltf")
          asset = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              *(f"Level_{i}" for i in range(1, 5)),
              *(f"Level_{i}_Broken" for i in range(1, 5)),
              "Foundation", "Frame", "Walls", "Roof", "Ruins_Fresh",
              "Ruins_Old", "Ruins_Overgrown", "Damage_Marks", "Scaffolding",
          }
          actual = {node["name"] for node in asset["nodes"]}
          assert actual == expected, actual ^ expected
          data = base64.b64decode(asset["buffers"][0]["uri"].split(",", 1)[1])
          assert len(data) == asset["buffers"][0]["byteLength"]
          assert len(asset["meshes"]) == len(expected)
          assert all(len(mesh["primitives"]) >= 2 for mesh in asset["meshes"])
          assert len(asset["materials"]) >= 12
          print("HEADQUARTERS-ART: 17 независимых художественных 3D-мешей")
          PY
      - name: "Импорт проекта и проверка GDScript"
        run: |
          set -o pipefail
          timeout 160s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/import.log; then exit 1; fi
      - name: "Поселение, 3D-центр I–IV, строительство, повреждения и WorldSave"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_settlement_13_smoke.gd \
            2>&1 | tee /tmp/settlement.log
          grep -q "STAGE13-SETTLEMENT: успешно" /tmp/settlement.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/settlement.log; then exit 1; fi
      - name: "Выбор реальной клетки на трёх seed"
        run: |
          set -o pipefail
          timeout 80s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_build_picker_13_smoke.gd \
            2>&1 | tee /tmp/placement.log
          grep -q "STAGE13-PLACEMENT: успешно" /tmp/placement.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/placement.log; then exit 1; fi

      - name: "Три независимых мира — оплаченная мастерская и WorldSave"
        run: |
          set -o pipefail
          timeout 300s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_stage13_multiseed_smoke.gd \
            2>&1 | tee /tmp/multiseed.log
          grep -q "STAGE13-MULTISEED: успешно" /tmp/multiseed.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/multiseed.log; then exit 1; fi

      - name: "Регрессия хозяйственного цикла 12"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_first_economy_12_smoke.gd \
            2>&1 | tee /tmp/economy.log
          grep -q "STAGE12-ECONOMY: успешно" /tmp/economy.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/economy.log; then exit 1; fi

      - name: "Регрессия производственного склада и реальных дорог"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_resource_industry_12_smoke.gd \
            2>&1 | tee /tmp/industry.log
          grep -q "STAGE12-INDUSTRY: успешно" /tmp/industry.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/industry.log; then exit 1; fi
