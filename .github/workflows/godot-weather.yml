name: Этап 11 — погодная визуализация и физические контракты

on:
  push:
    branches: [develop]
    paths:
      - "godot/scripts/weather_visual_state.gd"
      - "godot/scripts/weather_fx_controller.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/weather_visual_11_0_smoke.gd"
      - ".github/workflows/godot-weather.yml"
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/weather_visual_state.gd"
      - "godot/scripts/weather_fx_controller.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/weather_visual_11_0_smoke.gd"
      - ".github/workflows/godot-weather.yml"
  workflow_dispatch:

concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weather-physics-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Установить Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot-weather.zip
          unzip -q /tmp/godot-weather.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить импорт и компиляцию
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/weather-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-import.log; then
            exit 1
          fi
      - name: Проверить визуальные снимки погоды
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/weather_visual_11_0_smoke.gd \
            2>&1 | tee /tmp/weather-visual-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-visual-test.log; then
            exit 1
          fi
      - name: Проверить физику гроз и паводков
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/weather_flood_smoke.gd \
            2>&1 | tee /tmp/weather-physics-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-physics-test.log; then
            exit 1
          fi
      - name: Логи проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-weather-smoke
          path: |
            /tmp/weather-import.log
            /tmp/weather-visual-test.log
            /tmp/weather-physics-test.log
          if-no-files-found: ignore
