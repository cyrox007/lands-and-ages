name: Этап 11 — погодная визуализация и физические контракты

on:
  push:
    branches: [develop]
    paths:
      - "godot/scripts/weather_visual_state.gd"
      - "godot/scripts/climate.gd"
      - "godot/scripts/natural_disasters.gd"
      - "godot/tests/wind_field_11_3_smoke.gd"
      - "godot/tests/wind_disaster_art_11_3_smoke.gd"
      - "godot/tests/wind_disaster_art_11_3_capture.gd"
      - "godot/shaders/tornado_funnel.gdshader"
      - "godot/scripts/weather_lighting_state.gd"
      - "godot/shaders/natural_ground.gdshader"
      - "godot/tests/world_weather_l4_smoke.gd"
      - "godot/scripts/weather_fx_controller.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/weather_visual_11_0_smoke.gd"
      - "godot/tests/weather_atmosphere_11_0_smoke.gd"
      - "godot/scripts/weather_atmosphere_controller.gd"
      - "godot/scripts/weather_effect_catalog.gd"
      - "godot/tests/weather_precipitation_11_1_smoke.gd"
      - "godot/tests/lightning_11_4_smoke.gd"
      - "godot/tests/lightning_visual_11_4.gd"
      - "godot/scripts/lightning_fx_controller.gd"
      - "godot/scripts/nature_registry.gd"
      - "godot/tests/weather_precipitation_visual_11_1.gd"
      - "godot/shaders/local_precipitation.gdshader"
      - ".github/workflows/godot-weather.yml"
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/weather_visual_state.gd"
      - "godot/scripts/climate.gd"
      - "godot/scripts/natural_disasters.gd"
      - "godot/tests/wind_field_11_3_smoke.gd"
      - "godot/tests/wind_disaster_art_11_3_smoke.gd"
      - "godot/tests/wind_disaster_art_11_3_capture.gd"
      - "godot/shaders/tornado_funnel.gdshader"
      - "godot/scripts/weather_lighting_state.gd"
      - "godot/shaders/natural_ground.gdshader"
      - "godot/tests/world_weather_l4_smoke.gd"
      - "godot/scripts/weather_fx_controller.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/weather_visual_11_0_smoke.gd"
      - "godot/tests/weather_atmosphere_11_0_smoke.gd"
      - "godot/scripts/weather_atmosphere_controller.gd"
      - "godot/scripts/weather_effect_catalog.gd"
      - "godot/tests/weather_precipitation_11_1_smoke.gd"
      - "godot/tests/lightning_11_4_smoke.gd"
      - "godot/tests/lightning_visual_11_4.gd"
      - "godot/scripts/lightning_fx_controller.gd"
      - "godot/scripts/nature_registry.gd"
      - "godot/tests/weather_precipitation_visual_11_1.gd"
      - "godot/shaders/local_precipitation.gdshader"
      - ".github/workflows/godot-weather.yml"
  workflow_dispatch:

concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weather-physics-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Установить Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot-weather.zip
          unzip -q /tmp/godot-weather.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить импорт и компиляцию
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/weather-import.log
          # Предупреждения Godot о целочисленном делении и затенении
          # встроенных имён не должны снова попадать в исходники.
          if grep -Ei "INTEGER_DIVISION|SHADOWED_GLOBAL_IDENTIFIER|Integer division\\. Decimal part|same name as a built-in function" /tmp/weather-import.log; then
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-import.log; then
            exit 1
          fi
      - name: "11.0 — общий контроллер, каталог ресурсов, пресеты и безопасная загрузка"
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path godot \
            --script res://tests/weather_atmosphere_11_0_smoke.gd \
            2>&1 | tee /tmp/weather-atmosphere-11-0.log
          grep -q "Этап 11.0:.*успешно" /tmp/weather-atmosphere-11-0.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-atmosphere-11-0.log; then
            exit 1
          fi
      - name: Проверить визуальные снимки погоды
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/weather_visual_11_0_smoke.gd \
            2>&1 | tee /tmp/weather-visual-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-visual-test.log; then
            exit 1
          fi
      - name: "11.1 — выразительные осадки, физический климат и бюджет GPU"
        run: |
          set -o pipefail
          timeout 160s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/weather_precipitation_11_1_smoke.gd \
            2>&1 | tee /tmp/weather-precipitation-11-1.log
          grep -q "Этап 11.1:.*успешно" /tmp/weather-precipitation-11-1.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-precipitation-11-1.log; then
            exit 1
          fi
      - name: "11.4 — физический разряд, видимая молния и пространственный гром"
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path godot \
            --script res://tests/lightning_11_4_smoke.gd \
            2>&1 | tee /tmp/weather-lightning-11-4.log
          grep -q "Этап 11.4:.*успешно" /tmp/weather-lightning-11-4.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-lightning-11-4.log; then
            exit 1
          fi

      - name: "11.4 — видимый канал молнии в реальном Godot OpenGL"
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p /tmp/lightning-11-4
          timeout 210s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --audio-driver Dummy --path godot --rendering-method gl_compatibility \
            --script res://tests/lightning_visual_11_4.gd \
            -- --out=/tmp/lightning-11-4 \
            2>&1 | tee /tmp/weather-lightning-11-4-gl.log
          grep -q "Этап 11.4/GL:.*успешно" /tmp/weather-lightning-11-4-gl.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-lightning-11-4-gl.log; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/lightning-11-4")
          report = json.loads((root / "manifest.json").read_text())
          assert report["stage"] == "11.4"
          assert report["checks_passed"] and report["changed_sample_pixels"] >= 15
          assert not report["hardware_accepted"]
          for name in report["captures"]:
              assert (root / name).stat().st_size > 10000
          print("Этап 11.4/GL: реальные PNG и геометрия молнии — успешно")
          PY

      - name: "11.4 — сохранить изображения разряда"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-11-4-opengl-captures
          path: |
            /tmp/lightning-11-4/
            /tmp/weather-lightning-11-4-gl.log
          retention-days: 30
          if-no-files-found: warn

      - name: "11.3/V2: физическое направление и порывы ветра"
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/wind_field_11_3_smoke.gd \
            2>&1 | tee /tmp/weather-wind-v2.log
          grep -q "Этап 11.3/V2:.*успешно" /tmp/weather-wind-v2.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-wind-v2.log; then
            exit 1
          fi
      - name: "L4: физическая облачность и грозовой свет"
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_weather_l4_smoke.gd \
            2>&1 | tee /tmp/weather-l4.log
          grep -q "Этап 11.2/L4: свет и облачность по реальному климату — успешно" /tmp/weather-l4.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-l4.log; then
            exit 1
          fi
      - name: Проверить физику гроз и паводков
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/weather_flood_smoke.gd \
            2>&1 | tee /tmp/weather-physics-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/weather-physics-test.log; then
            exit 1
          fi
      - name: "11.3 — физический эпицентр, вращающаяся воронка и баланс аэрозоля"
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path godot \
            --script res://tests/wind_disaster_art_11_3_smoke.gd \
            2>&1 | tee /tmp/weather-wind-art-11-3.log
          grep -q "Этап 11.3/ART:.*успешно" /tmp/weather-wind-art-11-3.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-wind-art-11-3.log; then
            exit 1
          fi

      - name: "11.3 — настоящие PNG ветровых бедствий через программный GL"
        timeout-minutes: 9
        run: |
          set -o pipefail
          mkdir -p /tmp/wind-art-11-3
          timeout 480s xvfb-run -a -s "-screen 0 960x540x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --audio-driver Dummy --path godot --rendering-method gl_compatibility \
            --script res://tests/wind_disaster_art_11_3_capture.gd \
            -- --out=/tmp/wind-art-11-3 \
            2>&1 | tee /tmp/weather-wind-art-11-3-gl.log
          grep -q "Этап 11.3/GL:.*успешно" /tmp/weather-wind-art-11-3-gl.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-wind-art-11-3-gl.log; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("/tmp/wind-art-11-3")
          manifest = json.loads((base / "manifest.json").read_text())
          assert manifest["stage"] == "11.3"
          assert manifest["checks_passed"] is True
          assert manifest["visual_reference_events_only"] is True
          assert manifest["artistic_approval"] is False
          assert manifest["android_pc_gpu_verified"] is False
          assert len(manifest["scenes"]) == 6
          for scene in manifest["scenes"]:
              assert (base / scene["file"]).stat().st_size > 18000
              if scene["weather"] in ["смерч", "пыльная буря"]:
                  assert scene["changed_sample_pixels"] > 22
          print("Этап 11.3: шесть настоящих контрольных изображений — успешно")
          PY

      - name: "11.3 — опубликовать сравнительные игровые кадры"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-disasters-11-3-artistic-scenes
          path: |
            /tmp/wind-art-11-3/
            /tmp/weather-wind-art-11-3-gl.log
          if-no-files-found: warn
          retention-days: 30

      - name: "11.1 — сравнимые PNG осадков в оконном OpenGL"
        timeout-minutes: 5
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa
          mkdir -p /tmp/weather-11-1
          timeout 210s xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --audio-driver Dummy --path godot --rendering-method gl_compatibility \
            --script res://tests/weather_precipitation_visual_11_1.gd \
            -- --out=/tmp/weather-11-1 \
            2>&1 | tee /tmp/weather-11-1-visual.log
          grep -q "Этап 11.1/GL:.*успешно" /tmp/weather-11-1-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/weather-11-1-visual.log; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/weather-11-1")
          report = json.loads((root / "manifest.json").read_text())
          assert report["stage"] == "11.1"
          assert report["hardware_accepted"] is False
          assert report["checks_passed"] and len(report["captures"]) == 7
          for item in report["captures"]:
              assert (root / item["file"]).stat().st_size >= 7000
          print("Этап 11.1/GL: контрольные PNG и манифест — успешно")
          PY

      - name: "11.1 — сохранить контрольные изображения для художественной приёмки"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-11-1-precipitation-opengl
          path: |
            /tmp/weather-11-1/
            /tmp/weather-11-1-visual.log
          retention-days: 30
          if-no-files-found: warn
      - name: Логи проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-weather-smoke
          path: |
            /tmp/weather-import.log
            /tmp/weather-visual-test.log
            /tmp/weather-atmosphere-11-0.log
            /tmp/weather-precipitation-11-1.log
            /tmp/weather-lightning-11-4.log
            /tmp/weather-wind-v2.log
            /tmp/weather-wind-art-11-3.log
            /tmp/weather-wind-art-11-3-gl.log
            /tmp/weather-physics-test.log
            /tmp/weather-l4.log
          if-no-files-found: ignore
