name: Отладочный Android APK природного мира — этап 9.4

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/world-android-debug.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/world-android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3
      - name: Установить инструменты подписи и ARM64 APK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$JAVA_HOME/bin/keytool"
      - name: Скачать официальный Godot 4.7.2 и подходящие шаблоны
        timeout-minutes: 6
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            --output /tmp/godot-templates.tpz
          unzip -q /tmp/godot.zip -d /tmp
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-export
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp /tmp/godot-export/templates/* \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Подготовить отдельный временный ключ отладочной сборки
        run: |
          mkdir -p /tmp/world-android-keystore
          keytool -genkeypair -noprompt \
            -keystore /tmp/world-android-keystore/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 1000 \
            -dname "CN=World QA,O=Lands and Ages,C=US"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" \
            > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Импортировать Godot-проект
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 210s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/android-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load" /tmp/android-import.log; then
            exit 1
          fi
      - name: Экспортировать и подписать отладочный ARM64 APK
        timeout-minutes: 6
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/world-android-keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          timeout 300s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --export-debug Android "$GITHUB_WORKSPACE/build/lands-and-ages-world-qa-arm64.apk" \
            2>&1 | tee /tmp/android-export.log
          test -s build/lands-and-ages-world-qa-arm64.apk
          unzip -t build/lands-and-ages-world-qa-arm64.apk | tail -n 2
          unzip -l build/lands-and-ages-world-qa-arm64.apk | grep -q 'lib/arm64-v8a/'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            build/lands-and-ages-world-qa-arm64.apk
          sha256sum build/lands-and-ages-world-qa-arm64.apk > build/SHA256SUMS.txt
          echo "Этап 9.4: отладочный Android ARM64 APK подписан и проверен — успешно."
      - name: Сохранить APK для аппаратной проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-qa-android-arm64-debug
          path: |
            build/lands-and-ages-world-qa-arm64.apk
            build/SHA256SUMS.txt
            /tmp/android-export.log
          if-no-files-found: warn
          retention-days: 30
