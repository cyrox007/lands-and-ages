name: Verify published GitHub Pages layout
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate live fullscreen HUD and absence of page scrolling
        run: python tests/pages_published_smoke.py
