name: Подготовка CC0-атласов поверхностей — этап 9.1

on:
  push:
    branches:
      - feat/world-stage-9-1-real-pbr-surfaces

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world-stage-9-1-real-pbr-surfaces
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сформировать игровые атласы из CC0-исходников
        run: |
          if test -s godot/assets/terrain/terrain_albedo.png &&
             test -s godot/assets/terrain/terrain_normal_roughness.png; then
            echo "Атласы уже присутствуют в ветке."
            exit 0
          fi
          python -m pip install --quiet Pillow==11.3.0
          python tools/prepare_terrain_atlas.py
          python - <<'PY'
          from PIL import Image
          for name in ("terrain_albedo.png", "terrain_normal_roughness.png"):
              image = Image.open("godot/assets/terrain/" + name)
              assert image.size == (1152, 768), image.size
          print("Физические текстуры PBR сформированы, разрешение 1152×768.")
          PY
      - name: Сохранить атласы в рабочей ветке
        run: |
          git add godot/assets/terrain
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "assets(world): CC0 PBR атласы травы, почвы, песка, камня, щебня и снега"
          git push origin HEAD:refs/heads/feat/world-stage-9-1-real-pbr-surfaces
