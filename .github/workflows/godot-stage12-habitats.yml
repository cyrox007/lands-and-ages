name: "12.4 — биотопы и кормовая база"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/wildlife_habitats.gd"
      - "godot/tests/world_wildlife_habitats_12_smoke.gd"
      - "godot/scripts/nature_registry.gd"
      - "godot/scripts/surface.gd"
      - "godot/scripts/hydrology.gd"
      - ".github/workflows/godot-stage12-habitats.yml"
  workflow_dispatch:

jobs:
  habitats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: "Установить Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Проверить импорт скриптов"
        run: |
          set -o pipefail
          timeout 160s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/import.log; then exit 1; fi
      - name: "12.4 — биотопы, источники воды и корм"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_wildlife_habitats_12_smoke.gd \
            2>&1 | tee /tmp/habitats.log
          grep -q "STAGE12-HABITATS: успешно" /tmp/habitats.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/habitats.log; then exit 1; fi
