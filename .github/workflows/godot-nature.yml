name: Этап 10 — природные объекты и ресурсный баланс

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "godot/scripts/nature_*.gd"
      - "godot/assets/nature/**"
      - "godot/shaders/nature_*.gdshader"
      - "godot/scripts/world_capacity_audit.gd"
      - "godot/scripts/world_spatial_scenario.gd"
      - "godot/scripts/world_day_runner.gd"
      - "godot/scripts/world_save.gd"
      - "godot/scripts/world.gd"
      - "godot/scripts/world_map.gd"
      - "godot/scripts/hydrology.gd"
      - "godot/scripts/surface.gd"
      - "godot/scripts/climate.gd"
      - "godot/scripts/weather_events.gd"
      - "godot/scripts/natural_disasters.gd"
      - "godot/tests/nature_stage_10_smoke.gd"
      - "godot/tests/nature_collision_smoke.gd"
      - "godot/tests/nature_seed_audit.gd"
      - "godot/tests/world_capacity_report_10.gd"
      - ".github/workflows/godot-nature.yml"
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/nature_*.gd"
      - "godot/assets/nature/**"
      - "godot/shaders/nature_*.gdshader"
      - "godot/scripts/world_capacity_audit.gd"
      - "godot/scripts/world_spatial_scenario.gd"
      - "godot/scripts/world_day_runner.gd"
      - "godot/scripts/world_save.gd"
      - "godot/scripts/world.gd"
      - "godot/scripts/world_map.gd"
      - "godot/scripts/hydrology.gd"
      - "godot/scripts/surface.gd"
      - "godot/scripts/climate.gd"
      - "godot/scripts/weather_events.gd"
      - "godot/scripts/natural_disasters.gd"
      - "godot/tests/nature_stage_10_smoke.gd"
      - "godot/tests/nature_collision_smoke.gd"
      - "godot/tests/nature_seed_audit.gd"
      - "godot/tests/world_capacity_report_10.gd"
      - ".github/workflows/godot-nature.yml"

concurrency:
  group: nature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nature-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Скачать Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить импорт исходников
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/nature-import.log
          # Встроенные текстуры не должны давать предупреждения о старых UID.
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|invalid UID|using text path instead" /tmp/nature-import.log; then
            exit 1
          fi
      - name: Проверить настройки текстур GLB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          folder = Path("godot/assets/nature/quaternius_stylized")
          assets = sorted(folder.glob("*.glb"))
          assert len(assets) == 9, "Число стилизованных GLB изменилось"
          for asset in assets:
              path = Path(str(asset) + ".import")
              assert path.exists(), f"Отсутствуют параметры импорта: {asset.name}"
              settings = path.read_text(encoding="utf-8")
              assert 'gltf/embedded_image_handling=3' in settings, asset.name
              assert "Extract Textures" not in settings, asset.name
          # Встроенные текстуры не должны появляться как новые ресурсы в каталоге.
          unexpected = [path.name for path in folder.iterdir()
                        if path.is_file() and path.suffix.lower() in (".jpg", ".jpeg", ".png")]
          assert not unexpected, f"Зависимые внешние текстуры: {unexpected}"
          print("9 GLB используют внутренние текстуры, внешних файлов нет")
          PY
      - name: Тест этапа 10
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 260s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 240 --script res://tests/nature_stage_10_smoke.gd 2>&1 \
            | tee /tmp/nature-smoke.log
          grep -q "Этап 10:.*успешно" /tmp/nature-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:|invalid UID|using text path instead" /tmp/nature-smoke.log; then
            exit 1
          fi
      - name: Проверить природные коллизии этапа 10.6
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 120 \
            --script res://tests/nature_collision_smoke.gd 2>&1 \
            | tee /tmp/nature-collision.log
          grep -q "Этап 10.6: природные коллизии проверены успешно" /tmp/nature-collision.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/nature-collision.log; then
            exit 1
          fi
      - name: Измерить вместимость демонстрационной карты
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 240 \
            --script res://tests/world_capacity_report_10.gd 2>&1 \
            | tee /tmp/world-capacity-10.log
          grep -q "Этап 10.0: отчёт готов" /tmp/world-capacity-10.log
          test -s godot/tests/world-capacity-10.json
          cat godot/tests/world-capacity-10.json
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/world-capacity-10.log; then
            exit 1
          fi
      - name: Пробный размер 512×384 без изменения генератора
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 270s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_capacity_report_10.gd -- \
            --width=512 --height=384 --seed=1729 2>&1 \
            | tee /tmp/world-capacity-512.log
          grep -q "Этап 10.0: отчёт готов" /tmp/world-capacity-512.log
          cp godot/tests/world-capacity-10.json godot/tests/world-capacity-512-10.json
          test -s godot/tests/world-capacity-512-10.json

      - name: Быстрый обзор четырёх природных seed
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 210s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 180 \
            --script res://tests/nature_seed_audit.gd -- \
            --samples=4 --width=96 --height=80 --seed_start=1729 2>&1 \
            | tee /tmp/nature-seeds-smoke.log
          grep -q "Этап 10.7: проверено 4 seed, ошибок нет" /tmp/nature-seeds-smoke.log
          test -s godot/tests/world-ecology-seeds-10.json
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/nature-seeds-smoke.log; then
            exit 1
          fi
      - name: Сохранить отчёт размеров
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-capacity-stage-10
          path: godot/tests/world-capacity-10.json
          if-no-files-found: ignore
      - name: Сохранить измерения увеличенной карты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-capacity-512-stage-10
          path: godot/tests/world-capacity-512-10.json
          if-no-files-found: ignore
      - name: Сохранить обзор природных seed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecology-seed-smoke
          path: godot/tests/world-ecology-seeds-10.json
          if-no-files-found: ignore
      - name: Сохранить диагностику ошибок Godot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-nature-error-logs
          path: |
            /tmp/nature-import.log
            /tmp/nature-smoke.log
            /tmp/nature-collision.log
            /tmp/nature-seeds-smoke.log
            /tmp/world-capacity-10.log
          if-no-files-found: ignore
