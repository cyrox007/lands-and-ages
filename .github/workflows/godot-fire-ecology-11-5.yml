name: 11.5/ECO — экологическая регенерация выгоревшей подстилки

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/fire_registry.gd"
      - "godot/tests/fire_litter_ecology_11_5_smoke.gd"
      - "godot/tests/fire_litter_reserve_11_5_smoke.gd"
      - ".github/workflows/godot-fire-ecology-11-5.yml"
  push:
    branches: [develop]
    paths:
      - "godot/scripts/fire_registry.gd"
      - "godot/tests/fire_litter_ecology_11_5_smoke.gd"
      - "godot/tests/fire_litter_reserve_11_5_smoke.gd"
      - ".github/workflows/godot-fire-ecology-11-5.yml"

jobs:
  fire-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Скачать Godot 4.7.2
        run: |
          # Сетевые HTTP 504 не должны ошибочно считаться
          # физической регрессией модели после пожара.
          curl --fail --location --retry 16 --retry-delay 9 --retry-max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить импорт GDScript
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/fire-eco-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load" /tmp/fire-eco-import.log; then
            exit 1
          fi
      - name: 11.5/ECO — реальная экология, 36 суток и WorldSave
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/fire_litter_ecology_11_5_smoke.gd 2>&1 \
            | tee /tmp/fire-ecology.log
          grep -q "11.5/ECO:.*успешно" /tmp/fire-ecology.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/fire-ecology.log; then
            exit 1
          fi
      - name: 11.5/LITTER-RESERVE — дождь, повторный пожар и v8
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/fire_litter_reserve_11_5_smoke.gd 2>&1 \
            | tee /tmp/fire-litter-reserve.log
          grep -q "11.5/LITTER-RESERVE:.*успешно" /tmp/fire-litter-reserve.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/fire-litter-reserve.log; then
            exit 1
          fi
      - name: 11.5/F5b2c — почвенное восстановление, сезон и v3
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 150s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/fire_litter_regrowth_11_5_smoke.gd 2>&1 \
            | tee /tmp/fire-litter-regrowth.log
          grep -q "11.5/F5b2c:.*успешно" /tmp/fire-litter-regrowth.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" /tmp/fire-litter-regrowth.log; then
            exit 1
          fi
