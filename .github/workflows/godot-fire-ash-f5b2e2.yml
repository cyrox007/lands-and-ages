name: "11.5/F5b2e2 — осаждение речной золы и физическая мутность"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/fire_registry.gd"
      - "godot/scripts/water_mesh.gd"
      - "godot/scripts/chunk_build_worker.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/fire_*_11_5_smoke.gd"
      - ".github/workflows/godot-fire-ash-f5b2e2.yml"
  push:
    branches: [develop]
    paths:
      - "godot/scripts/fire_registry.gd"
      - "godot/scripts/water_mesh.gd"
      - "godot/scripts/chunk_build_worker.gd"
      - "godot/scripts/world.gd"
      - "godot/tests/fire_*_11_5_smoke.gd"
      - ".github/workflows/godot-fire-ash-f5b2e2.yml"
  workflow_dispatch:

jobs:
  river-ash:
    name: "F5b2e2 — баланс массы, водный меш и WorldSave v7"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: "Скачать Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot-f5b2e2.zip
          unzip -q /tmp/godot-f5b2e2.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Импортировать ресурсы и проверить GDScript"
        run: |
          set -o pipefail
          timeout 145s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 \
            | tee /tmp/f5b2e2-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" \
              /tmp/f5b2e2-import.log; then
            exit 1
          fi
      - name: "Регрессия речной золы, воды и прежних пожаров"
        timeout-minutes: 14
        run: |
          set -o pipefail
          for test in \
            fire_river_settling_11_5_smoke \
            fire_river_ash_11_5_smoke \
            fire_charcoal_11_5_smoke \
            fire_soil_11_5_smoke \
            fire_smolder_11_5_smoke \
            fire_presentation_11_5_f6_smoke \
            water_shore_w4_smoke; do
            timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
              --headless --audio-driver Dummy --path godot \
              --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" \
                "/tmp/$test.log"; then
              exit 1
            fi
          done
          grep -q "11.5/F5b2e2: осадок, мутная вода, баланс и JSON — успешно." \
            /tmp/fire_river_settling_11_5_smoke.log
          grep -q "11.5/F5b2e1: речная зольная взвесь, баланс и JSON — успешно" \
            /tmp/fire_river_ash_11_5_smoke.log
      - name: "Сохранить протоколы реальных Godot-тестов"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5b2e2-ash-settling-and-turbidity-logs
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/f5b2e2-import.log
            /tmp/fire_*.log
            /tmp/water_shore_w4_smoke.log
