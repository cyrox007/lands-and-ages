name: Verify strategy 0.4
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "*.js"
      - "*.css"
      - "*.html"
      - "*.json"
      - "assets/**"
      - "art/**"
      - "tests/**"
      - "tools/**"
      - "build_standalone.py"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "*.js"
      - "*.css"
      - "*.html"
      - "*.json"
      - "assets/**"
      - "art/**"
      - "tests/**"
      - "tools/**"
      - "build_standalone.py"
      - ".github/workflows/check.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Build offline game
        run: python build_standalone.py
      - name: Upload offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: lands-and-ages-play-0.4
          path: play.html
          retention-days: 30
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
