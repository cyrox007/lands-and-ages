name: Godot GPU world pilot

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-pilot.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-pilot.yml"

jobs:
  world-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать Godot 4.7.2 из официального релиза
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Импорт и проверка проекта
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi
      - name: Единое сохранение природного мира — этап 7.4
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_save_smoke.gd 2>&1 | tee /tmp/world-save-smoke.log
          grep -q "Этап 7.4:.*успешно" /tmp/world-save-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-save-smoke.log; then
            exit 1
          fi
      - name: Тест высот, климата и чанков
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_smoke.gd 2>&1 | tee /tmp/world-smoke.log
          grep -q "успешно" /tmp/world-smoke.log
      - name: Проверка устройства мира — этап 1
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 75s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_map_smoke.gd 2>&1 | tee /tmp/world-map-smoke.log
          grep -q "Этап 1:.*успешно" /tmp/world-map-smoke.log
          if grep -E "SCRIPT ERROR|Invalid call|Failed to load|ERROR:" /tmp/world-map-smoke.log; then
            exit 1
          fi
      - name: Проверка географических форм — этап 2
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/relief_smoke.gd 2>&1 | tee /tmp/relief-smoke.log
          grep -q "Этап 2:.*успешно" /tmp/relief-smoke.log
          if grep -E "SCRIPT ERROR|Invalid call|Failed to load|ERROR:" /tmp/relief-smoke.log; then
            exit 1
          fi
      - name: Проверка гидрологии — этап 3
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/hydrology_smoke.gd 2>&1 | tee /tmp/hydrology-smoke.log
          grep -q "Этап 3:.*успешно" /tmp/hydrology-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/hydrology-smoke.log; then
            exit 1
          fi
      - name: Проверка естественных рубежей — этап 3.1
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_boundary_smoke.gd 2>&1 | tee /tmp/world-boundary-smoke.log
          grep -q "Этап 3.1:.*успешно" /tmp/world-boundary-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-boundary-smoke.log; then
            exit 1
          fi
      - name: Проверка грунтов и поверхности — этап 4
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/surface_smoke.gd 2>&1 | tee /tmp/surface-smoke.log
          grep -q "Этап 4:.*успешно" /tmp/surface-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/surface-smoke.log; then
            exit 1
          fi
      - name: Проверка климата и биомов — этап 5
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/climate_smoke.gd 2>&1 | tee /tmp/climate-smoke.log
          grep -q "Этап 5:.*успешно" /tmp/climate-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/climate-smoke.log; then
            exit 1
          fi
      - name: Проверка плавной смены сезонов
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/seasonal_cycle_smoke.gd 2>&1 | tee /tmp/seasons-smoke.log
          grep -q "Сезоны:.*успешно" /tmp/seasons-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/seasons-smoke.log; then
            exit 1
          fi
      - name: Природные изменения карты — этап 6.1
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/landscape_events_smoke.gd 2>&1 | tee /tmp/landscape-smoke.log
          grep -q "Этап 6.1:.*успешно" /tmp/landscape-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/landscape-smoke.log; then
            exit 1
          fi
      - name: Естественная эрозия и ветровой перенос — этап 6.2
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/natural_processes_smoke.gd 2>&1 | tee /tmp/natural-processes.log
          grep -q "Этап 6.2:.*успешно" /tmp/natural-processes.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/natural-processes.log; then
            exit 1
          fi
      - name: Береговая эрозия и сохранение наносов — этап 6.3
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/sediment_smoke.gd 2>&1 | tee /tmp/sediment-smoke.log
          grep -q "Этап 6.3:.*успешно" /tmp/sediment-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/sediment-smoke.log; then
            exit 1
          fi
      - name: Грозы, паводки и речные дельты — этап 6.4
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/weather_flood_smoke.gd 2>&1 | tee /tmp/weather-flood-smoke.log
          grep -q "Этап 6.4:.*успешно" /tmp/weather-flood-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/weather-flood-smoke.log; then
            exit 1
          fi
      - name: Стихийные бедствия и геологическое напряжение — этап 6.5
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/natural_disasters_smoke.gd 2>&1 | tee /tmp/disasters-smoke.log
          grep -q "Этап 6.5:.*успешно" /tmp/disasters-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/disasters-smoke.log; then
            exit 1
          fi
      - name: Пакетная физика и бюджет GPU — этап 6.6
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_incremental_smoke.gd 2>&1 | tee /tmp/world-incremental.log
          grep -q "Этап 6.6:.*успешно" /tmp/world-incremental.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-incremental.log; then
            exit 1
          fi
      - name: Перемотка сезона и технический HUD — этап 7.1
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/season_fast_forward_smoke.gd 2>&1 | tee /tmp/season-fast-forward.log
          grep -q "Этап 7.1:.*успешно" /tmp/season-fast-forward.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/season-fast-forward.log; then
            exit 1
          fi
      - name: Фоновая физика и отзывчивость кадров — этап 7.2
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/background_world_smoke.gd 2>&1 | tee /tmp/background-world.log
          grep -q "Этап 7.2:.*успешно" /tmp/background-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/background-world.log; then
            exit 1
          fi
      - name: Стоимость гидрологии и природных угроз — этап 7.3
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/physics_cost_smoke.gd 2>&1 | tee /tmp/physics-cost-smoke.log
          grep -q "Этап 7.3:.*успешно" /tmp/physics-cost-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/physics-cost-smoke.log; then
            exit 1
          fi
      - name: Природные материалы и швы рельефа — этап 8.1
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/natural_landscape_visual_smoke.gd 2>&1 | tee /tmp/natural-landscape.log
          grep -q "Этап 8.1:.*успешно" /tmp/natural-landscape.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/natural-landscape.log; then
            exit 1
          fi
      - name: Скальные материалы и физический берег — этап 8.2
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/natural_shoreline_visual_smoke.gd 2>&1 | tee /tmp/natural-shoreline.log
          grep -q "Этап 8.2:.*успешно" /tmp/natural-shoreline.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/natural-shoreline.log; then
            exit 1
          fi
      - name: Адаптивная детализация камеры — этап 8.3
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_view_detail_smoke.gd 2>&1 | tee /tmp/view-detail.log
          grep -q "Этап 8.3:.*успешно" /tmp/view-detail.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/view-detail.log; then
            exit 1
          fi
      - name: Отсечение невидимых GPU-чанков — этап 8.4
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_frustum_smoke.gd 2>&1 | tee /tmp/world-frustum.log
          grep -q "Этап 8.4:.*успешно" /tmp/world-frustum.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-frustum.log; then
            exit 1
          fi
      - name: Ограниченный кеш GPU-чанков — этап 8.5
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_render_cache_smoke.gd 2>&1 | tee /tmp/world-render-cache.log
          grep -q "Этап 8.5:.*успешно" /tmp/world-render-cache.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-render-cache.log; then
            exit 1
          fi
      - name: Приоритетная очередь GPU — этап 8.6
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_build_queue_smoke.gd 2>&1 | tee /tmp/world-build-queue.log
          grep -q "Этап 8.6:.*успешно" /tmp/world-build-queue.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-build-queue.log; then
            exit 1
          fi
      - name: Длительный маршрут камеры и JSON-метрики — этап 8.7
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_camera_benchmark.gd \
            -- --report=/tmp/world-camera-8-7.json 2>&1 | tee /tmp/world-camera-8-7.log
          grep -q "Этап 8.7:.*успешно" /tmp/world-camera-8-7.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-camera-8-7.log; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("/tmp/world-camera-8-7.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["schema_version"] == 1
          assert report["route_version"] == 1
          assert report["route_frames"] >= 300
          assert len(report["phases"]) == 9
          assert report["summary"]["chunks_built"] > 0
          assert report["summary"]["visibility_fast_rejects"] > 0
          assert report["summary"]["visibility_precise_checks"] > 0
          assert report["summary"]["physics_unchanged"]
          assert all(phase["cache_limits_valid"] for phase in report["phases"])
          assert sum(phase["frames"] for phase in report["phases"]) == report["route_frames"]
          print("Этап 8.7: структура JSON и физические инварианты — успешно.")
          PY
      - name: Сохранить JSON замеров этапа 8.7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-camera-8-7
          path: /tmp/world-camera-8-7.json
          if-no-files-found: warn
          retention-days: 30
      - name: Финальная проверка видимости и устройства — этап 8.8
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_final_visual_smoke.gd 2>&1 | tee /tmp/world-final-visual.log
          grep -q "Этап 8.8:.*успешно" /tmp/world-final-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-final-visual.log; then
            exit 1
          fi
      - name: Физические PBR-текстуры природного мира — этап 9.1
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/world_pbr_materials_smoke.gd 2>&1 | tee /tmp/world-pbr-materials.log
          grep -q "Этап 9.1:.*успешно" /tmp/world-pbr-materials.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Failed to load|ERROR:" /tmp/world-pbr-materials.log; then
            exit 1
          fi
      - name: Загрузка игровой сцены
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 50s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 25 2>&1 | tee /tmp/world-runtime.log
          if grep -E "SCRIPT ERROR|Invalid call|Failed to load|ERROR:" /tmp/world-runtime.log; then
            exit 1
          fi
