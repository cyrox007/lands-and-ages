name: "11/HYDRO-HEAP — Priority-Flood без изменения водосборов"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/hydrology.gd"
      - "godot/tests/hydrology_priority_legacy.gd"
      - "godot/tests/hydrology_priority_perf_11_smoke.gd"
      - "godot/tests/hydrology_priority_day_11_smoke.gd"
      - ".github/workflows/godot-hydro-priority-perf.yml"
  push:
    branches: [develop]
    paths:
      - "godot/scripts/hydrology.gd"
      - "godot/tests/hydrology_priority_legacy.gd"
      - "godot/tests/hydrology_priority_perf_11_smoke.gd"
      - "godot/tests/hydrology_priority_day_11_smoke.gd"
      - ".github/workflows/godot-hydro-priority-perf.yml"
  workflow_dispatch:

concurrency:
  group: hydro-priority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: "Получить Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot-hydro.zip
          unzip -q /tmp/godot-hydro.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Импорт и проверка всех GDScript"
        run: |
          set -o pipefail
          timeout 160s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit \
            2>&1 | tee /tmp/hydro-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" \
              /tmp/hydro-import.log; then
            exit 1
          fi
      - name: "Этап 3 — реки, Priority-Flood, озёра и сохранения"
        run: |
          set -o pipefail
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/hydrology_smoke.gd \
            2>&1 | tee /tmp/hydro-original.log
          grep -q "Этап 3:.*успешно" /tmp/hydro-original.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" \
              /tmp/hydro-original.log; then
            exit 1
          fi
      - name: "11/HYDRO-HEAP — байтовое совпадение и CPU 256×192"
        timeout-minutes: 7
        run: |
          set -o pipefail
          timeout 390s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path godot \
            --script res://tests/hydrology_priority_perf_11_smoke.gd \
            2>&1 | tee /tmp/hydro-priority-perf.log
          grep -q "HYDRO-HEAP:.*успешно" /tmp/hydro-priority-perf.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" \
              /tmp/hydro-priority-perf.log; then
            exit 1
          fi
      - name: "11/HYDRO-DAY — четыре полных дня, дальние реки, WorldSave"
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout 430s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path godot \
            --script res://tests/hydrology_priority_day_11_smoke.gd \
            2>&1 | tee /tmp/hydro-full-day.log
          grep -q "HYDRO-DAY:.*успешно" /tmp/hydro-full-day.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|ERROR:" \
              /tmp/hydro-full-day.log; then
            exit 1
          fi
      - name: "Архивировать измерения"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydro-priority-perf-logs
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/hydro-import.log
            /tmp/hydro-original.log
            /tmp/hydro-priority-perf.log
            /tmp/hydro-full-day.log
