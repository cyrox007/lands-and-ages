name: "13 — перенос полезного из JS в Godot"

on:
  pull_request:
    branches: [develop]
    paths:
      - "godot/scripts/world_road_topology.gd"
      - "godot/tests/world_road_topology_13_smoke.gd"
      - "godot/project.godot"
      - "README.md"
      - ".github/workflows/godot-js-retirement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: "Проверить отказ от браузерного runtime"
        run: |
          test -f godot/project.godot
          test ! -e package.json
          test ! -e build_standalone.py
          test ! -e index.html
          test ! -d assets
          test ! -d art
          test ! -d tests
          if compgen -G '*.js' > /dev/null; then exit 1; fi
      - name: "Установить Godot 4.7.2"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: "Импорт Godot"
        run: |
          set -o pipefail
          timeout 160s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load" /tmp/import.log; then exit 1; fi
      - name: "Дорожная топология и точки подхода"
        run: |
          set -o pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_road_topology_13_smoke.gd 2>&1 | tee /tmp/road.log
          grep -q "STAGE13-ROAD-TOPOLOGY: успешно" /tmp/road.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" /tmp/road.log; then exit 1; fi
      - name: "Регрессия физической экономики"
        run: |
          set -o pipefail
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot \
            --script res://tests/world_first_economy_12_smoke.gd 2>&1 | tee /tmp/economy.log
          grep -q "STAGE12-ECONOMY: успешно" /tmp/economy.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" /tmp/economy.log; then exit 1; fi
